<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ĶLUS — pieslēgšanās</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      color: #526170;
      background: white;
    }

    .forma {
      display: flex;
      max-width: 1000px;
      min-height: 710px;
      margin: auto;
      border: 2px solid #e2e2e2;
    }

    .kreisais {
      width: 42%;
      padding: 70px 30px 40px;
      text-align: center;
      color: white;
      background: linear-gradient(#008cff, #00c2e8);
    }

    h1 {
      margin: 20px 0 25px;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.3;
    }

    .svitra {
      width: 170px;
      height: 1px;
      margin: 0 auto 30px;
      background: #a4ddff;
    }

    .kreisais p {
      font-size: 16px;
    }

    .ilustracija {
      width: 100%;
      max-width: 300px;
      margin-top: 60px;
    }

    .labais {
      width: 58%;
      padding: 45px 55px;
    }

    .atpakal {
      color: #001c35;
      font-size: 12px;
      text-decoration: none;
    }

    h2 {
      margin: 90px 0 10px;
      color: #008cff;
      font-size: 36px;
      font-weight: 500;
    }

    .apraksts {
      margin-bottom: 55px;
      font-size: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
    }

    input {
      display: block;
      width: 220px;
      max-width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #dddddd;
      font: inherit;
      font-size: 13px;
    }

    input::placeholder {
      color: #b8c0c8;
    }

    .pieslegties {
      margin-top: 10px;
      padding: 8px 17px;
      border: 1px solid #008cff;
      color: white;
      background: #008cff;
      font-size: 14px;
    }

    .registreties {
      margin-top: 32px;
      padding-top: 15px;
      border-top: 1px solid #dddddd;
      font-size: 12px;
    }

    .profils {
      padding: 0;
      border: none;
      color: #008cff;
      background: transparent;
      font: inherit;
    }

    @media (max-width: 650px) {
      .forma {
        flex-direction: column;
      }

      .kreisais,
      .labais {
        width: 100%;
        padding: 35px 25px;
      }

      .ilustracija {
        max-width: 200px;
        margin-top: 20px;
      }

      h2 {
        margin-top: 45px;
      }
    }
  </style>
</head>
<body>
  <main class="forma">
    <section class="kreisais">
      <h1>Esi sveicināts<br>ĶLUS</h1>
      <div class="svitra"></div>
      <p>Tavas laboratorijas uzskaites sistēma</p>

      <svg class="ilustracija"
           viewBox="0 0 300 280"
           role="img"
           aria-label="Laboratorijas kolba un mēģene">
        <circle cx="150" cy="140" r="115" fill="#e5f5ff"/>
        <circle cx="75" cy="65" r="6" fill="#9ad6ff"/>
        <circle cx="159" cy="35" r="6" fill="#9ad6ff"/>
        <circle cx="178" cy="24" r="4" fill="#9ad6ff"/>

        <path d="M125 65 H175 V130
                 C230 165 223 245 150 245
                 C77 245 70 165 125 130 Z"
              fill="#9bbcff"/>
        <rect x="116" y="56" width="68" height="17"
              fill="#a4c4ff"/>
        <path d="M102 183
                 C127 175 148 199 174 184
                 C185 178 196 178 202 180
                 C213 218 183 236 150 236
                 C118 236 96 216 102 183 Z"
              fill="#008cff"/>
        <circle cx="148" cy="154" r="7" fill="#68a8ff"/>
        <circle cx="154" cy="128" r="4" fill="#68a8ff"/>
        <circle cx="143" cy="104" r="4" fill="#68a8ff"/>

        <path d="M45 112 H77 V225
                 C77 249 45 249 45 225 Z"
              fill="#9bbcff"/>
        <path d="M52 147 H70 V225
                 C70 237 52 237 52 225 Z"
              fill="#008cff"/>
        <rect x="38" y="105" width="46" height="14"
              fill="#b4cdff"/>
        <circle cx="60" cy="135" r="3" fill="#008cff"/>
      </svg>
    </section>

    <section class="labais">
      <a class="atpakal" href="index.html">
        ← Atpakaļ uz sākumlapu
      </a>

      <h2>Pieslēgties</h2>
      <p class="apraksts">
        Ķīmijas laboratorijas uzskaites sistēmai
      </p>

      <form>
        <label for="lietotajs">Lietotājvārds</label>
        <input
          id="lietotajs"
          type="text"
          placeholder="Ievadīt lietotājvārdu"
          autocomplete="off">

        <label for="parole">Parole</label>
        <input
          id="parole"
          type="password"
          placeholder="Ievadīt paroli"
          autocomplete="off">

        <button class="pieslegties" type="button">
          Pieslēgties
        </button>
      </form>

      <p class="registreties">
        Neesi vēl reģistrēts?
        <button class="profils" type="button">
          Izveidot profilu
        </button>
      </p>
    </section>
  </main>
</body>
</html>
